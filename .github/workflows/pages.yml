name: Deploy EWP to GitHub Pages
# 只在 main 更新時部署（後台儲存由 cms-sync.yml 校正後觸發）。發布內容只有 dist/（產生的頁面＋白名單靜態檔），
# src/、scripts/、tests/、docs/、_preview/ 不會上傳。
# 啟用前必須把 Settings → Pages → Source 改為「GitHub Actions」（見 docs/DEPLOY_ROLLBACK.md）。
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    # 後台（Pages CMS）原始儲存不直接部署：由 cms-sync.yml 校正、驗證後再以 workflow_dispatch 觸發
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, '[後台]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 驗證與單元測試
        run: |
          node scripts/build.mjs --check
          node --test tests/data.test.mjs
      - name: 建置正式產物（不含草稿）
        run: node scripts/build.mjs
      - name: 發布白名單與草稿外洩檢查
        run: node scripts/check-site.mjs dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
