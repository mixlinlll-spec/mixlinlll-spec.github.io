name: 商品後台儲存後校正與發布
# Pages CMS（後台）每次儲存都會推送一個「[後台] …」commit，觸發本流程：
#   1. scripts/cms-normalize.mjs：還原 Pages CMS 清掉的空值、保護 id／slug／review、上架守門、新照片轉 WebP
#   2. 驗證＋建置＋發布白名單檢查（失敗就不發布，網站維持上一個正確版本，並開 Issue 通知）
#   3. 提交校正結果；在 main 上觸發 pages.yml 正式部署
# 變更摘要（操作者、時間、修改內容）在 Actions 的 Summary 頁。
on:
  push:
    branches: [main, feature/product-admin]
    paths: ['src/data/products/**', 'assets/img/products/**']
permissions:
  contents: write
  actions: write
  issues: write
concurrency:
  group: cms-sync-${{ github.ref }}
  cancel-in-progress: false
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安裝圖片處理套件
        run: npm install --no-save --no-audit --no-fund --no-package-lock sharp@0.35.4
      - name: 校正後台儲存的商品資料
        id: normalize
        run: node scripts/cms-normalize.mjs --base "${{ github.event.before }}" --summary "$GITHUB_STEP_SUMMARY"
      - name: 驗證、提交、發布
        if: steps.normalize.outputs.cms_commits != '0'
        uses: ./.github/actions/admin-publish
        with:
          message: "chore(後台): 校正後台儲存的商品資料"
          deploy: always
      - name: 失敗通知（開 Issue）
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --title "商品後台儲存未通過檢查（${GITHUB_REF_NAME}）" \
            --body "後台儲存後的檢查失敗，**網站沒有更新**（維持上一個正確版本）。請看執行紀錄：$URL

          常見原因：子分類不屬於主分類、價格為 0、照片檔不存在。修正後在後台再儲存一次即可。" || echo "無法開 Issue（repo 可能關閉 Issues）"
