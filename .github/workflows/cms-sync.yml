name: 商品後台儲存後校正與發布
# Pages CMS（後台）每次儲存都會推送一個「[後台] …」commit，觸發本流程：
#   1. scripts/cms-normalize.mjs：還原 Pages CMS 清掉的空值、保護 id／slug／review、上架守門、新照片轉 WebP
#   2. 逐件驗證：未通過的商品「退回上一個正確版本」（隔離），其他商品照常發布；開 Issue 說明原因
#   3. 完整驗證＋建置＋白名單檢查 → fast-forward 推送（衝突就從最新版本重做）→ 在 main 上部署這個 commit
# 寫入協定見 .github/actions/admin-publish/action.yml。變更摘要在 Actions 的 Summary 頁。
on:
  push:
    branches: [main, feature/product-admin]
    paths: ['src/data/products/**', 'assets/img/products/**']
permissions:
  contents: write
  actions: write
  issues: write
concurrency:
  # 同一分支的後台校正排隊執行；排隊中的舊執行被新的取代也沒關係（每次都會處理所有尚未校正的後台儲存）
  group: ewp-cms-sync-${{ github.ref }}
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 檢查是否有待校正的後台儲存
        id: check
        run: node scripts/cms-normalize.mjs --dry-run > /dev/null
      - name: 校正、隔離、驗證、提交、發布
        if: steps.check.outputs.cms_commits != '0'
        uses: ./.github/actions/admin-publish
        with:
          apply: 'true'
          message: "chore(後台): 校正後台儲存的商品資料"
          deploy: always
      - name: 失敗通知（開 Issue）
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --title "商品後台儲存未通過檢查（${GITHUB_REF_NAME}）" \
            --body "後台儲存後的處理失敗，**網站沒有更新**（維持上一個正確版本）。執行紀錄：$URL" || echo "無法開 Issue"
