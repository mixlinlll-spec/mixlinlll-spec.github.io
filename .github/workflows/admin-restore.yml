name: 後台｜還原商品
# 由 Pages CMS 商品頁的「還原這件商品到指定版本」按鈕觸發：把該商品檔還原成指定 commit 的內容，驗證後提交並發布。
on:
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS payload（JSON）
        required: true
        type: string
  # 只為了讓 GitHub 在測試分支上登記這個流程（workflow_dispatch 才能在非預設分支觸發）；push 時不執行任何工作
  push:
    branches: [feature/product-admin]
    paths: ['.github/workflows/admin-restore.yml']
permissions:
  contents: write
  actions: write
# 不設 concurrency group（GitHub 會取消排隊中的舊執行）；同時寫入由 admin-publish 的樂觀鎖處理：衝突就從最新版本重做並重新驗證
jobs:
  restore:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 套用、驗證、提交、發布
        uses: ./.github/actions/admin-publish
        env:
          PAYLOAD: ${{ inputs.payload }}
        with:
          apply: node scripts/admin-restore.mjs
          message: "[還原] ${{ fromJSON(inputs.payload).context.path }} → ${{ fromJSON(inputs.payload).inputs.sha }}（${{ fromJSON(inputs.payload).triggeredBy.name }}）"
          paths: src/data/products
