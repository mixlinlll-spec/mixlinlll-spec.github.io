name: EWP 後台：套用、驗證、提交、發布（樂觀鎖）
description: >
  所有後台寫入流程共用的提交協定：取得分支最新版本 → 套用操作 → 完整驗證 → 只用 fast-forward 推送。
  推送失敗（期間有人儲存）就丟棄本次結果，從最新版本重新套用並重新驗證，不做 rebase。
  只部署「驗證過、且已成功推送」的那個 commit。
inputs:
  apply:
    description: 在最新版本（已校正後台儲存）上執行的操作指令；後台儲存校正流程本身用 true
    required: true
  message:
    description: commit 訊息
    required: true
  paths:
    description: 要提交的路徑（空白分隔）
    default: src/data/products assets/img/products docs/SHOPEE_IMPORT_REPORT.md docs/shopee-import.csv
  deploy:
    description: always＝驗證通過就部署（後台儲存）；changed＝有提交才部署
    default: changed
outputs:
  committed:
    description: 是否有提交
    value: ${{ steps.run.outputs.committed }}
  sha:
    description: 驗證通過並推送（或無變更時的最新）commit
    value: ${{ steps.run.outputs.sha }}
runs:
  using: composite
  steps:
    - name: 安裝圖片處理套件（校正新上傳照片用）
      shell: bash
      run: node -e "require.resolve('sharp')" 2>/dev/null || npm install --no-save --no-audit --no-fund --no-package-lock sharp@0.35.4
    - name: 套用、驗證、提交（最多重試 5 次）
      id: run
      shell: bash
      env:
        APPLY: ${{ inputs.apply }}
        MSG: ${{ inputs.message }}
        PATHS: ${{ inputs.paths }}
      run: |
        set -uo pipefail
        git config user.name "ewp-admin[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        gate() {
          node scripts/build.mjs --check \
          && node --test tests/data.test.mjs tests/admin.test.mjs > unit.log 2>&1 || { tail -40 unit.log 2>/dev/null; return 1; }
          node scripts/build.mjs > build.log 2>&1 || { tail -40 build.log; return 1; }
          node scripts/check-site.mjs dist || return 1
        }
        fresh() {
          git fetch -q origin "$GITHUB_REF_NAME"
          git reset -q --hard "origin/$GITHUB_REF_NAME"
          git clean -fdq
          rm -rf .cms-quarantine .cms-quarantine.md
        }
        for attempt in 1 2 3 4 5; do
          echo "::group::第 $attempt 次：取得最新版本並套用"
          fresh
          BASE=$(git rev-parse HEAD)
          echo "基準版本 $BASE"
          # 每個寫入流程都先處理分支上尚未校正的後台儲存（逐件驗證、失敗的退回），再執行自己的操作
          node scripts/cms-normalize.mjs --summary "$GITHUB_STEP_SUMMARY" || { echo "::endgroup::"; echo "::error::既有資料錯誤（不是後台修改造成），未提交、未部署"; exit 1; }
          if ! bash -c "$APPLY"; then echo "::endgroup::"; echo "::error::操作失敗（未修改任何資料）"; exit 1; fi
          node scripts/report-shopee-import.mjs > /dev/null   # 匯入總表含網站價格／供貨，隨資料一起更新
          if ! gate; then
            echo "::warning::驗證失敗：整批退回尚未校正的後台儲存後重做一次"
            fresh
            node scripts/cms-normalize.mjs --quarantine-all --summary "$GITHUB_STEP_SUMMARY" \
              && bash -c "$APPLY" && node scripts/report-shopee-import.mjs > /dev/null && gate || { echo "::endgroup::"; echo "::error::退回後仍無法通過驗證，未提交、未部署"; exit 1; }
          fi
          echo "::endgroup::"
          git add -A $PATHS
          if git diff --cached --quiet; then
            echo "沒有需要提交的變更；最新版本 $BASE 已通過驗證"
            echo "committed=false" >> "$GITHUB_OUTPUT"; echo "sha=$BASE" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git commit -q -m "$MSG"
          if git push -q origin "HEAD:$GITHUB_REF_NAME"; then
            echo "committed=true" >> "$GITHUB_OUTPUT"; echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "已提交 $(git rev-parse --short HEAD)（基準 ${BASE:0:7}，第 $attempt 次）"; exit 0
          fi
          echo "::warning::推送衝突（期間有其他儲存），丟棄本次結果，從最新版本重新套用與驗證"
          sleep $((attempt * 3))
        done
        echo "::error::5 次都遇到推送衝突，未提交、未部署"; exit 1
    - name: 保存被退回的原始修改（供查看）
      if: always() && hashFiles('.cms-quarantine/**') != ''
      uses: actions/upload-artifact@v4
      with:
        name: cms-quarantine-${{ github.run_id }}
        path: .cms-quarantine/
        retention-days: 14
    - name: 通知：有修改未通過檢查已退回
      if: always() && hashFiles('.cms-quarantine.md') != ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        { cat .cms-quarantine.md; echo; echo "執行紀錄：$URL"; } > issue.md
        gh issue create --title "商品後台：有修改未通過檢查已退回（${GITHUB_REF_NAME}）" --body-file issue.md || echo "無法開 Issue"
    - name: 觸發正式部署（只在 main，指定剛驗證的 commit）
      if: github.ref_name == 'main' && (inputs.deploy == 'always' || steps.run.outputs.committed == 'true')
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        SHA: ${{ steps.run.outputs.sha }}
      run: |
        gh workflow run pages.yml --ref main -f sha="$SHA"
        echo "已觸發正式部署（${SHA:0:7}），約 1–2 分鐘後網站更新。" >> "$GITHUB_STEP_SUMMARY"
